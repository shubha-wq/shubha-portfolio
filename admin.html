<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Media admin — Shubha Singh</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23121110'/%3E%3Ctext x='16' y='22' font-family='Helvetica,Arial,sans-serif' font-size='16' font-weight='bold' fill='%23fff' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="site.js"></script>
<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #f1f0ed; color: #121110; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  a { color: #121110; text-decoration: none; }
  a:hover { color: #6e6b65; }
  ::selection { background: #121110; color: #f1f0ed; }
  @media (max-width: 1000px) {
    header { padding: 14px 20px !important; }
    #intro > div, #panel > div { padding: 40px 20px !important; }
    footer > div { padding: 22px 20px !important; }
  }
  @media (max-width: 620px) {
    header { flex-wrap: wrap !important; gap: 12px !important; }
    header nav { width: 100% !important; justify-content: space-between !important; gap: 8px !important; }
  }

.h0:hover{background: #6e6b65 !important}
.h1:hover{background: #6e6b65 !important}
.h2:hover{color: #121110 !important}
</style>
</head>
<body>
<div style="font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #f1f0ed; color: #121110; min-height: 100vh;">

  <header style="position: sticky; top: 0; z-index: 60; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 16px 40px; background: rgba(241,240,237,0.86); backdrop-filter: blur(14px); border-bottom: 1px solid #e3e1dc;">
    <a href="index.html" style="font-size: 14px; font-weight: 600; letter-spacing: -0.01em;">Home</a>
    <nav style="display: flex; align-items: center; gap: 26px;">
      <span style="font-size: 13px; font-weight: 500;">Media admin</span>
      <a class="h0" href="index.html" style="font-size: 13px; padding: 10px 18px; border-radius: 999px; background: #121110; color: #f1f0ed; transition: background .25s ease;">View site</a>
    </nav>
  </header>

  <section id="intro">
    <div style="max-width: 1000px; margin: 0 auto; padding: 56px 40px 28px; display: flex; flex-direction: column; gap: 20px;">
      <h1 style="margin: 0; font-size: clamp(36px, 6vw, 76px); font-weight: 500; line-height: 0.94; letter-spacing: -0.05em;">Media admin</h1>
      <p style="margin: 0; max-width: 60ch; font-size: 17px; line-height: 1.6; color: #6e6b65; text-wrap: pretty;">
        Switch any image or video off and it disappears from the live pages. Nothing is deleted — flip it back on any time. Changes save in this browser and apply the moment you open a page.
      </p>
      <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
        <button class="h1" type="button" id="adm-all-on" style="padding: 12px 22px; border-radius: 999px; border: 0; background: #121110; color: #f1f0ed; font-size: 14px; font-family: inherit; cursor: pointer; transition: background .25s ease;">Show everything</button>
        <span id="adm-count" style="font-size: 14px; color: #6e6b65;"></span>
      </div>
    </div>
  </section>

  <section id="panel" style="border-top: 1px solid #e3e1dc;">
    <div style="max-width: 1000px; margin: 0 auto; padding: 40px 40px 88px;">
      <div id="adm-groups" style="display: flex; flex-direction: column; gap: 44px;"></div>
    </div>
  </section>

  <footer style="border-top: 1px solid #e3e1dc;">
    <div style="max-width: 1000px; margin: 0 auto; padding: 26px 40px; display: flex; align-items: center; justify-content: space-between; gap: 24px; font-size: 13px; color: #6e6b65;">
      <span>© 2026 Shubha Singh</span>
      <a class="h2" href="index.html" style="color: #6e6b65;">Back to site →</a>
    </div>
  </footer>

</div>
<script>
(function () {
  function build() {
    var root = document.getElementById('adm-groups');
    if (!root || !window.SSMedia) { setTimeout(build, 120); return; }
    var groups = {};
    window.SSMedia.list.forEach(function (m) { (groups[m.page] = groups[m.page] || []).push(m); });
    root.innerHTML = '';
    Object.keys(groups).forEach(function (page) {
      var wrap = document.createElement('div');
      var head = document.createElement('div');
      head.setAttribute('style', 'display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding-bottom:16px;border-bottom:1px solid #121110;margin-bottom:4px;');
      var title = document.createElement('h2');
      title.setAttribute('style', 'margin:0;font-size:clamp(20px,2.2vw,28px);font-weight:500;letter-spacing:-0.03em;');
      title.textContent = page;
      var count = document.createElement('span');
      count.setAttribute('style', 'font-size:13px;color:#6e6b65;');
      count.textContent = groups[page].length + ' items';
      head.appendChild(title); head.appendChild(count); wrap.appendChild(head);

      groups[page].forEach(function (m) {
        var visible = !window.SSMedia.isHidden(m.id);
        var row = document.createElement('div');
        row.setAttribute('style', 'display:flex;align-items:center;justify-content:space-between;gap:24px;padding:18px 0;border-bottom:1px solid #e3e1dc;');
        var left = document.createElement('div');
        left.setAttribute('style', 'display:flex;flex-direction:column;gap:5px;');
        var label = document.createElement('div');
        label.setAttribute('style', 'font-size:16px;');
        label.textContent = m.label;
        var state = document.createElement('div');
        state.setAttribute('style', 'font-size:13px;color:#6e6b65;');
        left.appendChild(label); left.appendChild(state);

        var btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('role', 'switch');
        function paint(on) {
          btn.setAttribute('style', 'position:relative;width:56px;height:32px;flex:0 0 auto;border-radius:999px;border:1px solid ' + (on ? '#121110' : '#d5d2cb') + ';background:' + (on ? '#121110' : 'transparent') + ';cursor:pointer;padding:0;transition:background .25s ease,border-color .25s ease;');
          btn.innerHTML = '<span style="position:absolute;top:3px;left:' + (on ? '27px' : '3px') + ';width:24px;height:24px;border-radius:999px;background:' + (on ? '#f1f0ed' : '#6e6b65') + ';transition:left .25s cubic-bezier(.22,.61,.36,1),background .25s ease;"></span>';
          btn.setAttribute('aria-checked', on ? 'true' : 'false');
          btn.setAttribute('aria-label', (on ? 'Hide ' : 'Show ') + m.label);
          state.textContent = on ? 'Visible on the site' : 'Hidden';
        }
        paint(visible);
        btn.addEventListener('click', function () {
          var next = btn.getAttribute('aria-checked') !== 'true';
          window.SSMedia.set(m.id, next);
          paint(next);
          updateCount();
        });
        row.appendChild(left); row.appendChild(btn); wrap.appendChild(row);
      });
      root.appendChild(wrap);
    });

    var allOn = document.getElementById('adm-all-on');
    if (allOn && !allOn.dataset.bound) {
      allOn.dataset.bound = '1';
      allOn.addEventListener('click', function () { window.SSMedia.showAll(); build(); });
    }
    updateCount();
  }
  function updateCount() {
    var el = document.getElementById('adm-count');
    if (!el || !window.SSMedia) return;
    var n = window.SSMedia.hidden().length;
    el.textContent = n === 0 ? 'Everything is visible.' : n + (n === 1 ? ' item hidden.' : ' items hidden.');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', build);
  else build();
})();
</script>
</body>
</html>
